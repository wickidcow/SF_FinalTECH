    name: '{color:prandom}Matrix Reactor'
    info:
      1:
        name: '{color:stress}Introduction'
        lore:
          - '{color:normal}Put the target item to the center'
          - '{color:normal}Consuming {id:_FINALTECH_UNORDERED_DUST} {color:normal}and {id:_FINALTECH_ORDERED_DUST} {color:normal}to copy item'
        output: '_FINALTECH_UNORDERED_DUST'
      2:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Consuming {id:_FINALTECH_UNORDERED_DUST} {color:normal}and {id:_FINALTECH_ORDERED_DUST} {color:normal}'
          - '{color:normal}to make progress {color:stress}randomly increase 1 or reduce 1'
          - ''
          - '{color:normal}While the sum of the progress and the amount of input item equal to {color:number}{1}'
          - '{color:normal}The target item will be copied by {color:number}1'
        output: '_FINALTECH_ORDERED_DUST'
      3:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}The amount {id:_FINALTECH_UNORDERED_DUST} {color:normal}and {id:_FINALTECH_ORDERED_DUST} {color:normal}consumed each time'
          - '{color:normal}is equal to the amount of the input item'
          - ''
          - '{color:normal}Else the progress will be reduced by {color:number}1'
      4:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Change the target item will reset the progress to {color:number}0'
      5:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Put {id:_FINALTECH_PHONY} {color:normal}in the up side'
          - '{color:normal}will force the progress to increase instead of randomly change'
