FinalTech: 'FinalTECH'
helper:
  ICON:
    consumer:
      name: '{color:normal}Consumer'
    generator:
      name: '{color:normal}Generator'
    capacitor:
      name: '{color:normal}Capacitor'
    wiki-icon:
      name: '{color:stress}Parameters'
      lore:
        - '§7{1}'
        - '{color:normal}Research: {color:negative}{2}'
        - '{color:normal}Addon: {color:initiative}{3}'
        - '{color:normal}EE Input Value: {color:number}{4}'
        - '{color:normal}EE Output Value: {color:number}{5}'
      lore-energy:
        - '{color:normal}Energy Type: {color:passive}{1}'
        - '{color:normal}Energy Capacity: {color:number}{2} J'
      no-research: '{color:positive}NONE'
      GENERATOR: 'Generator'
      CAPACITOR: 'Capacitor'
      CONSUMER: 'Consumer'
      CONNECTOR: 'Connector'
      NONE: 'None'
    recipe-icon:
      name: '{color:stress}Display Recipe'
    quantity-module:
      name: '{color:normal}Quantity Module'
      lore:
        - '{color:normal}Insert {id:_FINALTECH_QUANTITY_MODULE} {color:normal}to change efficiency'
      amount-lore:
        - '{color:normal}Efficiency: {color:number}{1}'
      amount-infinity: '{color:stress}Infinity'
      amount-none-lore:
        - '{color:normal}Efficiency: {color:negative}{1}'
    next-page:
      name: '{color:normal}Next Page'
    previous-page:
      name: '{color:normal}Previous Page'
    status:
      name: '{color:normal}Status'
    error:
      name: '{color:normal}Error'
  CARGO_ORDER:
    positive:
      name: '{color:normal}Cargo Order {color:conceal}- {color:random}Positive'
      lore:
        - '{color:normal}Iterate through the location queue in positive order'
    reverse:
      name: '{color:normal}Cargo Order {color:conceal}- {color:random}Reverse'
      lore:
        - '{color:normal}Iterate through the location queue in reverse order'
  MACHINE_MAX_STACK:
    icon:
      name: '{color:normal}Machine Max Stack'
    '0':
      lore:
        - '{color:normal}No limit on cargo input'
    value:
      lore:
        - '{color:normal}Maximum stack size for cargo input: {color:number}{1}'
  CARGO_NUMBER:
    icon:
      name: '{color:normal}Cargo Number'
      lore:
        - '{color:normal}Transfer up to {color:number}{1} items {color:normal}at a time'
      lore0:
        - '{color:normal}No limit on items transferred at a time'
    add-icon:
      name: '{color:normal}Cargo Number {color:conceal}- {color:random}Add'
    sub-icon:
      name: '{color:normal}Cargo Number {color:conceal}- {color:random}Sub'
  CARGO_FILTER:
    black-filter-mode:
      name: '{color:normal}Cargo Filter {color:conceal}- {color:random}Black'
      lore:
        - '{color:normal}Transfer items that do not match'
    white-filter-mode:
      name: '{color:normal}Cargo Filter {color:conceal}- {color:random}White'
      lore:
        - '{color:normal}Transfer items that match'
  CARGO_MODE:
    input-main:
      name: '{color:normal}Cargo Mode {color:conceal}- {color:random}Input Main'
      lore:
        - '{color:normal}Push item from input side to output side'
    output-main:
      name: '{color:normal}Cargo Mode {color:conceal}- {color:random}Output Main'
      lore:
        - '{color:normal}Pull item from input side to output side'
    strong-symmetry:
      name: '{color:normal}Cargo Mode {color:conceal}- {color:random}Strong Symmetry'
      lore:
        - '{color:normal}Transfer item from input side to output side'
        - '{color:normal}Item will only be transferred to the same slot'
    weak-symmetry:
      name: '{color:normal}Cargo Mode {color:conceal}- {color:random}Weak Symmetry'
      lore:
        - '{color:normal}Transfer item from input side to output side'
        - '{color:normal}Item will be transferred to the same slot if possible'
  CARGO_LIMIT:
    all:
      name: '{color:normal}Cargo Limit {color:conceal}- {color:random}All'
      lore:
        - '{color:normal}No Limit'
    type:
      name: '{color:normal}Cargo Limit {color:conceal}- {color:random}Type'
      lore:
        - '{color:normal}Only one item type will be transferred at a time'
    stack:
      name: '{color:normal}Cargo Limit {color:conceal}- {color:random}Stack'
      lore:
        - '{color:normal}Only one item type will be transferred at a time'
        - '{color:normal}The transfer amount will not exceed the item''s maximum stack size'
    nonnull:
      name: '{color:normal}Cargo Limit {color:conceal}- {color:random}Nonnull'
      lore:
        - '{color:normal}Slots without item will be skipped'
    first:
      name: '{color:normal}Cargo Limit {color:conceal}- {color:random}First'
      lore:
        - '{color:normal}Only one slot will be involved'
        - '{color:normal}(similar to Slimefun cargo)'
  SLOT_SEARCH_SIZE:
    inputs-only:
      name: '{color:normal}Slot Search Size {color:conceal}- {color:random}Inputs Only'
      lore:
        - '{color:normal}Only input slots are considered'
        - '{color:normal}(Only for slimefun container)'
    outputs-only:
      name: '{color:normal}Slot Search Size {color:conceal}- {color:random}Outputs Only'
      lore:
        - '{color:normal}Only output slots are considered'
        - '{color:normal}(Only for slimefun container)'
    inputs-and-outputs:
      name: '{color:normal}Slot Search Size {color:conceal}- {color:random}Inputs And Outputs'
      lore:
        - '{color:normal}Size = input slots + output slots'
        - '{color:normal}(Only for slimefun container)'
    outputs-and-inputs:
      name: '{color:normal}Slot Search Size {color:conceal}- {color:random}Outputs And Inputs'
      lore:
        - '{color:normal}Size = output slots + input slots'
        - '{color:normal}(Only for slimefun container)'
  SLOT_SEARCH_ORDER:
    ascent:
      name: '{color:normal}Slot Search Order {color:conceal}- {color:random}Ascent'
      lore:
        - '{color:normal}Ascending order uses the result of {color:stress}slot search size'
    descend:
      name: '{color:normal}Slot Search Order {color:conceal}- {color:random}Descend'
      lore:
        - '{color:normal}Descending order uses the result of {color:stress}slot search size'
    first-only:
      name: '{color:normal}Slot Search Order {color:conceal}- {color:random}First Only'
      lore:
        - '{color:normal}Use only the first slot from {color:stress}slot search size'
    last-only:
      name: '{color:normal}Slot Search Order {color:conceal}- {color:random}Last Only'
      lore:
        - '{color:normal}Use only the last slot from {color:stress}slot search size'
    random:
      name: '{color:normal}Slot Search Order {color:conceal}- {color:random}Random'
      lore:
        - '{color:normal}Randomly select from the result of {color:stress}slot search size'
  BLOCK_SEARCH_MODE:
    zero:
      name: '{color:normal}Block Search Mode {color:conceal}- {color:random}Zero'
      lore:
        - '{color:normal}No remote search'
    inherit:
      name: '{color:normal}Block Search Mode {color:conceal}- {color:random}Inherit'
      lore:
        - '{color:normal}Remote search'
        - "{color:normal}Follow connected blocks of the same type and preserve direction"
    penetrate:
      name: '{color:normal}Block Search Mode {color:conceal}- {color:random}Penetrate'
      lore:
        - '{color:normal}Remote search'
        - "{color:normal}Pass through connected blocks of the same type without changing direction"
    interrupt:
      name: '{color:normal}Block Search Mode {color:conceal}- {color:random}Interrupt'
      lore:
        - '{color:normal}Remote search'
        - "{color:normal}Stop when another block of the same type is encountered"
  BLOCK_SEARCH_ORDER:
    positive:
      name: '{color:normal}Block Search Order {color:conceal}- {color:random}Positive'
      lore:
        - '{color:normal}Search block from closest to farthest'
    reverse:
      name: '{color:normal}Block Search Order {color:conceal}- {color:random}Reverse'
      lore:
        - '{color:normal}Search block from farthest to closest'
    random:
      name: '{color:normal}Block Search Order {color:conceal}- {color:random}Random'
      lore:
        - '{color:normal}Search block randomly in all connected blocks'
  BLOCK_SEARCH_CYCLE:
    'false':
      name: '{color:normal}Block Search Cycle {color:conceal}- {color:random}False'
      lore:
        - '{color:normal}Do not add the first block to the end of the block queue'
    'true':
      name: '{color:normal}Block Search Cycle {color:conceal}- {color:random}True'
      lore:
        - '{color:normal}Add the first block to the end of the block queue'
  BLOCK_SEARCH_SELF:
    'false':
      name: '{color:normal}Block Search Self {color:conceal}- {color:random}False'
      lore:
        - "{color:normal}Do not add this block to the block queue"
    start:
      name: '{color:normal}Block Search Self {color:conceal}- {color:random}Start'
      lore:
        - "{color:normal}Add this block to the start of the block queue"
    end:
      name: '{color:normal}Block Search Self {color:conceal}- {color:random}End'
      lore:
        - "{color:normal}Add this block to the end of the block queue"
  POSITION_INFO:
    north:
      name: '{color:normal}Position {color:conceal}- {color:random}North'
    east:
      name: '{color:normal}Position {color:conceal}- {color:random}East'
    south:
      name: '{color:normal}Position {color:conceal}- {color:random}South'
    west:
      name: '{color:normal}Position {color:conceal}- {color:random}West'
    up:
      name: '{color:normal}Position {color:conceal}- {color:random}Up'
    down:
      name: '{color:normal}Position {color:conceal}- {color:random}Down'
    'null':
      lore:
        - '{color:stress}Null'
        - '{color:normal}Do nothing on this side'
    input:
      lore:
        - '{color:stress}Input'
        - '{color:normal}Allow input on this side'
    output:
      lore:
        - '{color:stress}Output'
        - '{color:normal}Allow output on this side'
    input-and-output:
      lore:
        - '{color:stress}Input And Output'
        - '{color:normal}Allow input on this side'
        - '{color:normal}Allow output on this side'
  MACHINE_RECIPE_LOCK:
    icon:
      name: '{color:random}Recipe Lock'
      lore:
        - '{color:normal}Recipe Lock is disabled'
        - '{color:action}[Left-click] {color:normal}Enable or reset {color:stress}Recipe Lock'
        - '{color:action}[Right-click] {color:normal}Disable {color:stress}Recipe Lock'
    input:
      title:
        - '{color:stress}Inputs:'
      items:
        - '    §f{1}{color:normal}x {color:number}{2}'
    output:
      title:
        - '{color:stress}Outputs:'
      items:
        - '    §f{1}{color:normal}x {color:number}{2}'
    unlock:
      lore:
        - '{color:normal}Recipe Lock is disabled'
        - '{color:action}[Left-click] {color:normal}Enable or reset {color:stress}Recipe Lock'
        - '{color:action}[Right-click] {color:normal}Disable {color:stress}Recipe Lock'
    lock-off:
      lore:
        - '{color:normal}Make the machine work to lock one recipe'
  CARGO_NUMBER_MODE:
    universal:
      lore1: '{color:stress}Universally {color:normal}calculate the cargo number'
    standalone:
      lore1: '{color:stress}Individually {color:normal}calculate the cargo number'
  FORCE_CLOSE:
    'false':
      name: '{color:normal}Force Close {color:conceal}- {color:random}False'
      lore:
        - '{color:normal}Keep the menu open if the operation cannot run'
    'true':
      name: '{color:normal}Force Close {color:conceal}- {color:random}True'
      lore:
        - '{color:normal}Close the menu if the operation cannot run'
