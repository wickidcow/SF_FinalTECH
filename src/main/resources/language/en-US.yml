items:
  _FINALTECH_WATER_CARD:
    name: '{color:prandom}Water Card'
    info:
      1:
        name: '{color:positive}Usage'
        lore:
          - '{color:normal}Can replace a water bucket in supported machines'
  _FINALTECH_LAVA_CARD:
    name: '{color:prandom}Lava Card'
    info:
      1:
        name: '{color:positive}Usage'
        lore:
          - '{color:normal}Can replace a lava bucket in supported machines'
  _FINALTECH_MILK_CARD:
    name: '{color:prandom}Milk Card'
    info:
      1:
        name: '{color:positive}Usage'
        lore:
          - '{color:normal}Can replace a milk bucket in supported machines'
  _FINALTECH_FLINT_AND_STEEL_CARD:
    name: '{color:prandom}Flint and steel Card'
    info:
      1:
        name: '{color:positive}Usage'
        lore:
          - '{color:normal}Can replace flint and steel in supported machines'
  _FINALTECH_GEARWHEEL:
    name: '{color:prandom}Gearwheel'
    info:
      1:
        name: '{color:initiative}Additional Crafting'
        lore:
          - '{color:normal}Can be crafted in a vanilla crafting table'
        output: 'CRAFTING_TABLE'
  _FINALTECH_UNORDERED_DUST:
    name: '{color:prandom}Unordered Dust'
  _FINALTECH_ORDERED_DUST:
    name: '{color:prandom}Ordered Dust'
  _FINALTECH_BUG:
    name: '{color:prandom}Bug'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be obtained in {id:_FINALTECH_EQUIVALENT_EXCHANGE_TABLE}'
        output: '_FINALTECH_EQUIVALENT_EXCHANGE_TABLE'
  _FINALTECH_ENTROPY:
    name: '{color:prandom}Entropy'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be obtained in {id:_FINALTECH_ENTROPY_CONSTRUCTOR}'
        output: '_FINALTECH_ENTROPY_CONSTRUCTOR'
      2:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be obtained in {id:_FINALTECH_BASIC_LOGIC_FACTORY}'
        output: '_FINALTECH_BASIC_LOGIC_FACTORY'
  _FINALTECH_ETHER:
    name: '{color:prandom}Ether'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}This is a GEO resource'
          - '{color:normal}It should be mined by {id:_FINALTECH_ETHER_MINER}'
        output: '_FINALTECH_ETHER_MINER'
  _FINALTECH_BOX:
    name: '{color:prandom}Box'
    info:
      1:
        name: '{color:initiative}Obtaining method'
        lore:
          - '{color:normal}Will be generated while:'
          - '{color:normal}The player dies'
          - '{color:normal}The death location is at least 64 blocks above the world's maximum height'
    message: '{color:normal}You forget something :D'
  _FINALTECH_SHINE:
    name: '{color:prandom}Shine'
    info:
      1:
        name: '{color:initiative}Obtaining method'
        lore:
          - '{color:normal}Can be obtained when:'
          - '{color:normal}The player takes damage'
          - '{color:normal}The player is at least 64 blocks below the world's minimum height'
          - '{color:normal}The player is carrying {id:_FINALTECH_BOX}'
      2:
        name: '{color:negative}Void Curse'
        lore:
          - '{color:normal}When obtaining {id:_FINALTECH_SHINE}'
          - '{color:normal}The player is briefly afflicted by the Void Curse'
      3:
        name: '{color:negative}Notice'
        lore:
          - '{color:normal}While carrying {id:_FINALTECH_SHINE} {color:normal}or {id:_FINALTECH_BOX}'
          - '{color:normal}Void damage taken by the player is greatly increased'
      4:
        name: '{color:negative}Notice'
        lore:
          - '{color:normal}While carrying {id:_FINALTECH_BOX}'
          - '{color:normal}if the player is below the world or afflicted by the Void Curse'
          - '{color:negative}The player will lose all items on death!'
    message: '{color:normal}You forget something :D'
  _FINALTECH_COPY_CARD:
    name: '{color:prandom}Copy Card'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be crafted in {id:_FINALTECH_ITEM_SERIALIZATION_CONSTRUCTOR} {color:normal}(Only for Slimefun items)'
          - '{color:normal}Can be crafted in {id:_FINALTECH_MATRIX_ITEM_SERIALIZATION_CONSTRUCTOR} {color:normal}(Support all items)'
        output: '_FINALTECH_ITEM_SERIALIZATION_CONSTRUCTOR'
      2:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Slowly generate specified item in {id:_FINALTECH_ITEM_DESERIALIZE_PARSER}'
        output: '_FINALTECH_ITEM_DESERIALIZE_PARSER'
    status:
      lore:
        - '{color:normal}Item name: {color:number}{1}'
        - '{color:normal}Item amount: {color:number}{2}'
  _FINALTECH_ANNULAR:
    name: '{color:prandom}Annular'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be crafted in {id:_FINALTECH_CARD_OPERATION_TABLE}'
        output: '_FINALTECH_CARD_OPERATION_TABLE'
  _FINALTECH_QUANTITY_MODULE:
    name: '{color:prandom}Quantity Module'
    info:
      1:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Can tweak the efficiency of some machines'
          - '{color:normal}Lower-tier efficiency settings remain compatible'
      2:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Efficiency: {color:number}n * {1} + nd{2} {color:conceal}(n = item amount)'
  _FINALTECH_ENERGIZED_QUANTITY_MODULE:
    name: '{color:prandom}Quantity Module {color:conceal}- {color:positive}Energized'
    info:
      1:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Can tweak the efficiency of some machines'
          - '{color:normal}Lower-tier efficiency settings remain compatible'
      2:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Efficiency: {color:number}n * {1} + nd{2} {color:conceal}(n = item amount)'
  _FINALTECH_OVERLOADED_QUANTITY_MODULE:
    name: '{color:prandom}Quantity Module {color:conceal}- {color:positive}Overloaded'
    info:
      1:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Can tweak the efficiency of some machines'
          - '{color:normal}Lower-tier efficiency settings remain compatible'
      2:
        name: '{color:passive}Mechanism'
        lore:
          - '{color:normal}Efficiency: {color:number}n * {1} + nd{2} {color:conceal}(n = item amount)'
  _FINALTECH_SINGULARITY:
    name: '{color:prandom}Singularity'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be crafted in {id:_FINALTECH_ITEM_SERIALIZATION_CONSTRUCTOR}'
          - '{color:normal}Can be crafted in {id:_FINALTECH_MATRIX_ITEM_SERIALIZATION_CONSTRUCTOR}'
        output: '_FINALTECH_ITEM_SERIALIZATION_CONSTRUCTOR'
  _FINALTECH_SPIROCHETE:
    name: '{color:prandom}Spirochete'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be crafted in {id:_FINALTECH_ITEM_SERIALIZATION_CONSTRUCTOR}'
          - '{color:normal}Can be crafted in {id:_FINALTECH_MATRIX_ITEM_SERIALIZATION_CONSTRUCTOR}'
        output: '_FINALTECH_ITEM_SERIALIZATION_CONSTRUCTOR'
  _FINALTECH_SHELL:
    name: '{color:prandom}Shell'
    info:
      1:
        name: '{color:positive}Usage'
        lore:
          - '{color:normal}Can be used to copy one {id:_FINALTECH_COPY_CARD} {color:normal}in {id:_FINALTECH_CARD_OPERATION_TABLE}'
        output: '_FINALTECH_CARD_OPERATION_TABLE'
  _FINALTECH_PHONY:
    name: '{color:prandom}Phony'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be crafted in {id:_FINALTECH_ITEM_SERIALIZATION_CONSTRUCTOR}'
          - '{color:normal}Can be crafted in {id:_FINALTECH_MATRIX_ITEM_SERIALIZATION_CONSTRUCTOR}'
        output: '_FINALTECH_ITEM_SERIALIZATION_CONSTRUCTOR'
      2:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be crafted in {id:_FINALTECH_CARD_OPERATION_TABLE}'
        output: '_FINALTECH_CARD_OPERATION_TABLE'
  _FINALTECH_JUSTIFIABILITY:
    name: '{color:prandom}Justifiability'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
          - '{color:normal}Can be obtained by using {id:_FINALTECH_ENTROPY_SEED}'
        output: '_FINALTECH_ENTROPY_SEED'
  _FINALTECH_EQUIVALENT_CONCEPT:
    name: '{color:prandom}Equivalent Concept'
    info:
      1:
        name: '{color:initiative}Production method'
        lore:
