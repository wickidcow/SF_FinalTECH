        name: '{color:passive}Craft Item Shell'
        lore:
        - '{color:normal}Use {id:_FINALTECH_SINGULARITY} {color:normal}or {id:_FINALTECH_SPIROCHETE} {color:normal}to craft
          one {id:_FINALTECH_SHELL}'
