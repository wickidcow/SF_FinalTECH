_FINALTECH_ELECTRIC_REACTOR:
  english: null
  chinese:
    name: '{color:prandom}电活化反应催化堆'
    info:
      '1':
        name: '{color:stress}简介'
        lore:
        - '{color:normal}检测周围2格范围的所有机器的储存电力'
        - '{color:normal}当有超过5台机器电量超过储能上限并且有超过5台机器储能超过1M时'
        - '{color:normal}消耗所有电力并破坏反应催化物以进行活化反应并增加进度, 进度达到{color:number} 16777216 {color:norma;}制作出更高级的物品'
        - '{color:normal}当催化物不足时, 反应进度将{color:number} -1; 若更换反应物则清零进度'
        - '{color:normal}储能计算支持本附属的电容'
        - '{color:normal}反应过程中 {id:_FINALTECH_ENTROPY} {color:normal}可以作为万能催化物, 进度{color:number} +5'
        - '{color:normal}反应过程中 {id:_FINALTECH_PHONY} {color:normal}可以作为万能催化物, 进度{color:number} +262144'
      '2':
        name: '{color:stress}增加 {id:_FINALTECH_COPY_CARD} {color:normal}中物品数量'
        lore:
        - '{color:normal}用 {id:_FINALTECH_COPY_CARD} {color:normal}作为反应物'
        - '{color:normal}可以使用 {id:_FINALTECH_SHINE} {color:normal}和 {color:_FINALTECH_BOX} {color:normal}作为催化物'
        - '{color:normal}此时每次消耗时进度增加 {color:number}16384'
        - '{color:normal}可以使用 {id:_FINALTECH_EQUIVALENT_CONCEPT} {color:normal}和 {color:_FINALTECH_JUSTIFIABILITY} {color:normal}作为催化物'
        - '{color:normal}此时每次消耗时进度增加 {color:number}131072'
        output: _FINALTECH_COPY_CARD
      '3':
        name: '{color:stress}制作 {id:_FINALTECH_STRING}'
        lore:
        - '{color:normal}用 {id:_FINALTECH_ENTROPY_SEED} {color:normal}作为反应物'
        - '{color:normal}可以使用 {id:_FINALTECH_SINGULARITY} {color:normal}和 {color:_FINALTECH_SPIROCHETE} {color:normal}作为催化物'
        - '{color:normal}此时每次消耗时进度增加 {color:number}1048576'
        output: _FINALTECH_STRING
      '4':
        name: '{color:stress}制作 {id:_FINALTECH_EQUIVALENT_CONCEPT}'
        lore:
        - '{color:normal}用 {id:_FINALTECH_ENTROPY_SEED} {color:normal}作为反应物'
        - '{color:normal}可以使用 {id:_FINALTECH_BUG} {color:normal}和 {color:_FINALTECH_ANNULAR} {color:normal}作为催化物'
        - '{color:normal}此时每次消耗时进度增加 {color:number}16384'
        output: _FINALTECH_EQUIVALENT_CONCEPT
      '5':
        name: '{color:stress}制作 {id:_FINALTECH_ENERGY_CARD_Q}'
        lore:
        - '{color:normal}用 {id:_FINALTECH_ENERGY_CARD_T} {color:normal}作为反应物'
        - '{color:normal}可以使用 {id:_FINALTECH_ORDERED_DUST} {color:normal}和 {color:_FINALTECH_UNORDERED_DUST} {color:normal}作为催化物'
        - '{color:normal}此时每次消耗时进度增加 {color:number}16384'
        output: _FINALTECH_ENERGY_CARD_Q
    lore:
    - '&7反应~催化↑爆炸:D'
_FINALTECH_ENERGIZED_ELECTRICITY_SHOOT_PILE:
  english:
    name: '{color:prandom}Energized Electricity Shoot Pile'
    info:
      1:
        name: '{color:passive}Mechanism'
        lore:
        - '{color:normal}Transfer energy from a capacitor or generator behind it'
        - '{color:normal}To machines in its path one by one'
        - ''
        - '{color:normal}It tries to charge all machines at the same time'
        - '{color:normal}It skips machines that are fully charged'
        - ''
        - '{color:normal}Range: {color:number}{1}'
    status:
      lore:
      - '{color:normal}Affected Machines: {color:number}{1}'
      - '{color:normal}Transfer Energy: {color:number}{2} J'
  chinese:
    name: '{color:prandom}充能射电桩'
    info:
      '1':
        name: '{color:passive}机制'
        lore:
        - '{color:normal}将自身背向的电容电量'
        - '{color:normal}依次传输给自身面向的机器'
        - ''
        - '{color:normal}它会尝试同时给所有机器充电, 并且传输电量将增加 {color:number}50%'
        - '{color:normal}并忽略满电量机器'
        - ''
        - '{color:normal}范围: {color:number}{1} 格'
      '2':
        name: '{color:negative}限制'
        lore:
        - '{color:normal}无法给其它电容器输电'
    status:
      lore:
      - '{color:normal}有效机器: {color:number}{1} 台'
      - '{color:normal}转移电量: {color:number}{2} J'
    lore: []
