        output: _FINALTECH_STORAGE_CARD
    merge-storage-card:
      info-icon:
        name: '{color:passive}Merge Storage Card'
        lore:
        - '{color:normal}Merge two {id:_FINALTECH_STORAGE_CARD} {color:normal}into one'
        output: _FINALTECH_STORAGE_CARD
    copy-copy-card:
      info-icon:
        name: '{color:passive}Copy Copy Card'
        lore:
