name: Deprecation Part 2 Audit

on:
  push:
    branches: [audit/deprecation-part2-final]
    paths:
      - '.github/workflows/deprecation-part2-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FinalTECH
        uses: actions/checkout@v6

      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT -x test --no-daemon

      - name: Expose suppressed deprecations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/main/java")
          changed = 0
          for path in root.rglob("*.java"):
              source = path.read_text(encoding="utf-8")
              original = source

              source = source.replace('@SuppressWarnings("deprecation")', '')

              def strip_array(match):
                  items = [x.strip() for x in match.group(1).split(",")]
                  items = [x for x in items if x.strip('"') != "deprecation"]
                  if not items:
                      return ""
                  if len(items) == 1:
                      return f'@SuppressWarnings({items[0]})'
                  return '@SuppressWarnings({' + ', '.join(items) + '})'

              source = re.sub(
                  r'@SuppressWarnings\(\{([^}]*)\}\)',
                  strip_array,
                  source,
              )

              if source != original:
                  path.write_text(source, encoding="utf-8")
                  changed += 1

          print(f"Exposed deprecated API use in {changed} Java files.")
          PY

      - name: Compile deprecation audit
        shell: bash
        run: |
          set -o pipefail
          mvn -B -DskipTests -Dmaven.compiler.failOnWarning=false clean package 2>&1 | tee deprecation-audit.log

      - name: Summarize deprecations
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("deprecation-audit.log").read_text(encoding="utf-8", errors="replace")
          warnings = [
              line for line in log.splitlines()
              if "[WARNING]" in line and ("deprecated" in line.lower() or "marked for removal" in line.lower())
          ]

          print(f"DEPRECATION_WARNING_LINES={len(warnings)}")
          files = {}
          for line in warnings:
              match = re.search(r'src/main/java/([^:]+):\[(\d+),(\d+)\]\s+(.*)$', line)
              if not match:
                  continue
              path = "src/main/java/" + match.group(1)
              files.setdefault(path, []).append(match.group(4))

          print(f"DEPRECATION_FILES={len(files)}")
          for path in sorted(files):
              unique = []
              for warning in files[path]:
                  if warning not in unique:
                      unique.append(warning)
              print(f"### {path}")
              for warning in unique:
                  print(f"- {warning}")
          PY
