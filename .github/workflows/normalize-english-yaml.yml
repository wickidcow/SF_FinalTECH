name: Normalize FinalTECH English YAML

on:
  push:
    branches: [fix/english-yaml-validation]
    paths:
      - 'scripts/normalize_english_yaml.py'
      - '.github/workflows/normalize-english-yaml.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/english-yaml-validation

      - name: Normalize English YAML quoting
        run: python3 scripts/normalize_english_yaml.py

      - name: Commit normalized locale
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/language/en-US.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize English YAML apostrophes'
            git push origin HEAD:fix/english-yaml-validation
          fi

      - name: Check normalized YAML quoting
        run: python3 scripts/normalize_english_yaml.py --check

      - name: Parse English YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          with Path('src/main/resources/language/en-US.yml').open(encoding='utf-8') as stream:
              yaml.safe_load(stream)
          print('English YAML parsed successfully.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build FinalTECH
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
