name: Verify FinalTECH Category Lore

on:
  push:
    branches: [guide/category-lore]
    paths:
      - 'scripts/apply_category_lore_cleanup.py'
      - 'scripts/apply_guide_lore_visibility.py'
      - '.github/workflows/verify-category-lore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out guide branch
        uses: actions/checkout@v6
        with:
          ref: guide/category-lore

      - name: Apply Guide category cleanup
        run: |
          python3 scripts/apply_category_lore_cleanup.py
          python3 scripts/apply_guide_lore_visibility.py

      - name: Verify category names, lore and sorting
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'String path = "categories." + key + ".name";' src/main/java/io/taraxacum/finaltech/util/ConfigUtil.java
          grep -F 'getCategoryLore(languageManager, key, defaultLore)' src/main/java/io/taraxacum/finaltech/util/ConfigUtil.java
          grep -F 'List<String> combinedLore = new ArrayList<>(categoryLore);' src/main/java/io/taraxacum/finaltech/core/group/MainItemGroup.java
          grep -F 'List<String> combinedLore = new ArrayList<>(categoryLore);' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'FinalTechMenus.MAIN_ITEM_GROUP.setTier(3);' src/main/java/io/taraxacum/finaltech/setup/SetupUtil.java
          grep -F 'Advanced automation, logistics and end-game technology.' src/main/resources/language/en-US.yml
          grep -F 'Storage, routing, filtering and automated item transport.' src/main/resources/language/en-US.yml
          grep -F 'Legacy items kept for compatibility; avoid new use.' src/main/resources/language/en-US.yml

      - name: Validate English YAML quoting
        run: python3 scripts/normalize_english_yaml.py --check

      - name: Parse English YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('src/main/resources/language/en-US.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          categories = data.get('categories', {})
          assert categories['_FINALTECH_ITEM_GROUP']['name']
          assert categories['_FINALTECH_ITEM_GROUP']['lore']
          assert categories['_FINALTECH_MAIN_MENU_CARGO_SYSTEM']['lore']
          assert categories['_FINALTECH_SUB_MENU_DEPRECATED']['lore']
          print(f'Parsed {len(categories)} category definitions successfully.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build FinalTECH
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Commit verified Guide changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/taraxacum/finaltech/util/ConfigUtil.java \
                  src/main/java/io/taraxacum/finaltech/setup/FinalTechMenus.java \
                  src/main/java/io/taraxacum/finaltech/core/group/MainItemGroup.java \
                  src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java \
                  src/main/java/io/taraxacum/finaltech/setup/SetupUtil.java \
                  src/main/resources/language/en-US.yml
          git diff --cached --check
          git commit -m 'Improve FinalTECH Guide category presentation'
          git push origin HEAD:guide/category-lore
