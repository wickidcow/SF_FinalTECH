name: Verify FinalTECH Range-Limit Drop Fix

on:
  push:
    branches: [fix/range-limit-drop-self]
    paths:
      - 'scripts/apply_range_limit_drop_fix.py'
      - '.github/workflows/verify-range-limit-drop-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/range-limit-drop-self

      - name: Apply targeted source fix
        run: python3 scripts/apply_range_limit_drop_fix.py

      - name: Verify stale warning is gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "Be careful if you have the Slimefun addon 'BedrockTechnology'" src/main/java
          ! grep -R "There is a duplication bug, and we may fix it in next version" src/main/java
          grep -F "boolean shouldDropSelf = dropSelf && item.getId().equals(storedItemId);" src/main/java/io/taraxacum/finaltech/util/BlockTickerUtil.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build FinalTECH
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/taraxacum/finaltech/setup/SetupUtil.java \
                  src/main/java/io/taraxacum/finaltech/util/BlockTickerUtil.java
          git diff --cached --check
          git commit -m 'Fix range-limit drop-self handling'
          git push origin HEAD:fix/range-limit-drop-self
