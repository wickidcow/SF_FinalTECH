name: Apply English Localization

on:
  push:
    branches: [localization/english-first]
    paths:
      - '.github/workflows/apply-english-localization.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out localization branch
        uses: actions/checkout@v6
        with:
          ref: localization/english-first

      - name: Apply English-first translations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if required:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  return
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Make English the real default locale, not just the apparent config label.
          replace(
              'src/main/java/io/taraxacum/finaltech/FinalTechChanged.java',
              'String language = this.config.getOrDefault("zh-CN", "language");',
              'String language = this.config.getOrDefault("en-US", "language");'
          )

          config = Path('src/main/resources/config.yml')
          config_text = config.read_text(encoding='utf-8')
          if not config_text.startswith('language: en-US\n'):
              config_text = 'language: en-US\n\n' + config_text
          config_text = config_text.replace(
              "message: '{1} 不被允许放的太近 ;)'",
              "message: '{1} cannot be placed this close to another instance.'"
          )
          config.write_text(config_text, encoding='utf-8')

          for path in [
              'src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java',
              'src/main/java/io/taraxacum/finaltech/core/group/CraftItemGroup.java',
              'src/main/java/io/taraxacum/finaltech/core/group/TypeItemGroup.java',
          ]:
              replace(path, '§a> 点击解锁', '§a> Click to unlock')
              replace(
                  path,
                  '§7花费: §b" + research.getCost() + " 等级经验',
                  '§7Cost: §b" + research.getCost() + " Experience Levels'
              )

          replace(
              'src/main/java/io/taraxacum/finaltech/core/item/machine/range/point/EquivalentConcept.java',
              '[FINALTECH] 物品 等概念体 出现了异常, 但不要担心这是正常情况',
              '[FinalTECH] Equivalent Concept encountered an expected exception; normal operation will continue.'
          )

          replace(
              'src/main/java/io/taraxacum/finaltech/setup/FinalTechItemStacks.java',
              '&f此乱序改版作者, 基于作者原有build 75进行修复、调整与魔改',
              '&fAuthor of this modified FinalTECH version, based on original build 75 with fixes, balance adjustments, and mechanic changes.'
          )

          setup = Path('src/main/java/io/taraxacum/finaltech/setup/SetupUtil.java')
          setup_text = setup.read_text(encoding='utf-8')
          setup_text = setup_text.replace(
              '        FinalTechChanged.getInstance().getLogger().warning("可能出现了一些异常但是事实上这并不影响插件运行与工作, 请忽略它!");\n',
              ''
          )
          setup_text = setup_text.replace(
              "Please be carefully if you installed slimefun addon '基岩科技'(BedrockTechnology) and you set drop-self as true.",
              "Be careful if you have the Slimefun addon 'BedrockTechnology' installed and set drop-self to true."
          )
          setup.write_text(setup_text, encoding='utf-8')

          plugin = Path('src/main/resources/plugin.yml')
          plugin_text = plugin.read_text(encoding='utf-8')
          plugin_text = plugin_text.replace(
              'description: About making the world faster',
              'description: A Slimefun addon about making the world faster.'
          )
          if 'website:' not in plugin_text:
              plugin_text = plugin_text.replace(
                  'description: A Slimefun addon about making the world faster.\n',
                  'description: A Slimefun addon about making the world faster.\nwebsite: https://github.com/wickidcow/SF_FinalTECH\n'
              )
          plugin.write_text(plugin_text, encoding='utf-8')

          Path('README.md').write_text('''# FinalTECH-Changed — English Maintained Fork

FinalTECH-Changed is a heavily modified continuation of FinalTECH, focused on high-throughput automation, cargo systems, endgame progression, balance changes, and bug fixes.

This repository is the English-first maintained fork at `wickidcow/SF_FinalTECH`.

## Lineage and credits

The Changed edition is based on Final_ROOT's FinalTECH build 75 and later work by QYhB05 and balugaq. The original Final_ROOT repository was later deleted or made private, so surviving forks and maintained continuations are important references for compatibility and terminology.

This fork keeps the Changed edition as the gameplay baseline. It does **not** silently replace its recipes, balance, mechanics, item IDs, or saved-data behavior with another FinalTECH port.

Established English terminology is cross-checked against `LobbyTech-MC/FinalTech` whenever the same item or mechanic exists there. This avoids introducing conflicting literal translations for established names such as **Equivalent Concept**, **Justifiability**, **Entropy Seed**, **Entropy Cleaner**, **Item Phony**, **Ordered Dust**, **Unordered Dust**, and **Matrix Reactor**.

## Language support

English (`en-US`) is the default language in this maintained fork.

The Simplified Chinese (`zh-CN`) and Traditional Chinese (`zh-TW`) locale files are retained as optional translations. Source code, documentation, default configuration, logs, and other maintained project text are English-first.

## Compatibility notes

FinalTECH-Changed includes extensive parameter changes, recipe balancing, mechanic adjustments, and bug fixes compared with older FinalTECH builds.

It can coexist with some other FinalTECH variants, but items from different variants should **not** be assumed to be mutually compatible. Do not replace one variant with another on a live world without testing and backups.

Many values are configurable. Machine descriptions and performance expectations generally assume the default settings unless otherwise stated.

Upstream notes that an item-registration warning may appear during startup. In the Changed lineage this warning has been treated as harmless when the plugin otherwise enables normally.

## Performance notes

FinalTECH is powerful by design. Cargo networks, large automation chains, and some endgame mechanics can increase Slimefun tick time. The Changed edition contains optimizations compared with much older builds, including fixes for chain-card TPS problems, but server owners should still monitor demanding setups.

Some machines and items are intentionally powerful enough that administrators may want to restrict them on larger public servers.

## Entropy Seed

The **Entropy Seed** (`_FINALTECH_ENTROPY_SEED`) is an endgame progression item used to produce **Equivalent Concept** and **Justifiability**, two of FinalTECH's ultimate materials.

Under normal progression it is intentionally very expensive and may take a long time to obtain without assistance from other addons or item-copying mechanics.

### What it does

When placed, the Entropy Seed begins a finite propagation process involving Equivalent Concept and Justifiability.

- Generated Equivalent Concepts can continue spreading and producing additional Equivalent Concept and Justifiability nearby.
- Equivalent Concepts produced by the process eventually convert into Justifiability.
- Produced Justifiability automatically disappears after 5 ticks.
- The process is **not infinite**, but one full run can create tens of thousands of temporary objects/material events and may noticeably increase Slimefun tick time for a short period.

### Stopping the propagation

You can either allow the process to finish naturally or use the **Entropy Cleaner** supplied by FinalTECH.

Right-click the Entropy Cleaner to enable cleanup mode. While active, it removes Equivalent Concept and Justifiability created by the entropy process. Right-click it again to disable cleanup mode.

### Server-owner guidance

A single normal use should recover on its own after the propagation finishes. Placing many Entropy Seeds in a short period can produce severe temporary Slimefun tick delay, so public servers should decide how they want to control access.

Possible policies include:

- temporarily enabling the item only when a player is ready to perform the progression step;
- offering a controlled exchange for Equivalent Concept and Justifiability instead of unrestricted seed placement;
- establishing server rules and maintaining good backups;
- allowing normal use while monitoring abuse; or
- disabling the mechanic entirely if its performance profile does not fit the server.

The upstream Changed documentation suggested an example exchange of **1 Item Phony + 24 stacks of Entropy** for **192 Equivalent Concept + 1024 Justifiability**. Treat that as a historical balance suggestion, not a requirement for this maintained fork.

## Building

The current source still follows the Changed edition's Maven build layout. Further Paper/Slimefun Legacy modernization is tracked separately from this translation pass so localization changes do not alter gameplay behavior.

## License

FinalTECH-Changed is distributed under the MIT License. Preserve the license and original credits when redistributing modified builds.
''', encoding='utf-8')

          Path('docs/TERMINOLOGY.md').write_text('''# FinalTECH English terminology

This fork follows established English naming from the maintained FinalTECH lineage wherever an existing term is available.

| Internal ID / concept | Preferred English term |
| --- | --- |
| `_FINALTECH_EQUIVALENT_CONCEPT` | Equivalent Concept |
| `_FINALTECH_JUSTIFIABILITY` | Justifiability |
| `_FINALTECH_ENTROPY_SEED` | Entropy Seed |
| `_FINALTECH_ENTROPY_CLEANER` | Entropy Cleaner |
| `_FINALTECH_ITEM_PHONY` | Item Phony |
| `_FINALTECH_ORDERED_DUST` | Ordered Dust |
| `_FINALTECH_UNORDERED_DUST` | Unordered Dust |
| `_FINALTECH_MATRIX_REACTOR` | Matrix Reactor |

Do not rename internal IDs, configuration keys, persistent-data keys, or serialized identifiers solely to match display names. This glossary is for player-facing text, documentation, logs, and future translations.
''', encoding='utf-8')

          # Remove temporary branch setup markers; keep only useful localization documentation.
          for path in [
              'docs/README_LOCALIZATION_NOTE.md',
              'docs/STATUS.md',
              'docs/.localization-workstream',
              'docs/.audit-trigger',
              'docs/.pr-ready',
              'docs/.stop',
              'docs/.continue',
          ]:
              p = Path(path)
              if p.exists():
                  p.unlink()
          PY

      - name: Verify no CJK remains outside Chinese locale files
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInP '[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}]' . \
              --exclude-dir=.git \
              --exclude='zh-CN.yml' \
              --exclude='zh-TW.yml'; then
            echo 'CJK text remains outside the intentional Chinese locale files.' >&2
            exit 1
          fi

      - name: Commit localization pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No localization changes to commit.'
            exit 0
          fi
          git commit -m 'Translate remaining maintained surfaces to English'
          git push origin HEAD:localization/english-first
