name: Apply Java Import Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_duplicate_imports.py'
      - '.github/workflows/apply-java-import-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Remove duplicate Java imports
        run: python3 scripts/fix_duplicate_imports.py

      - name: Verify source hygiene
        run: python3 scripts/verify_source_hygiene.py

      - name: Validate patch
        run: git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wickidcow'
          git config user.email '185013218+wickidcow@users.noreply.github.com'
          git add src/main/java
          if git diff --cached --quiet; then
            echo 'No duplicate imports remained.'
            exit 0
          fi
          git commit -m 'Cleanup duplicate Java imports'
          git push
