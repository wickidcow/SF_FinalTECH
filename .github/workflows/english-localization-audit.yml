name: English Localization Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-only-surfaces:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject CJK text outside intentional Chinese locale files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t offenders < <(
            grep -RInP '[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}]' . \
              --exclude-dir=.git \
              --exclude='zh-CN.yml' \
              --exclude='zh-TW.yml' \
              || true
          )

          if (( ${#offenders[@]} > 0 )); then
            echo 'CJK text remains outside the intentional Chinese locale files:'
            printf '%s\n' "${offenders[@]}"
            exit 1
          fi

          echo 'English localization audit passed.'

      - name: Validate English YAML quoting
        run: python3 scripts/normalize_english_yaml.py --check

      - name: Parse English YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('src/main/resources/language/en-US.yml')
          with path.open(encoding='utf-8') as stream:
              yaml.safe_load(stream)
          print('English YAML parsed successfully.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Compile translated source
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
