name: English Localization Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  english-only-surfaces:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply translation workstream
        if: github.event_name == 'pull_request' && github.head_ref == 'localization/english-first'
        shell: bash
        run: python3 scripts/apply_english_localization.py

      - name: Commit translation workstream
        if: github.event_name == 'pull_request' && github.head_ref == 'localization/english-first'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Translate remaining maintained surfaces to English'
            git push origin HEAD:localization/english-first
          fi

      - name: Reject CJK text outside intentional Chinese locale files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t offenders < <(
            grep -RInP '[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}]' . \
              --exclude-dir=.git \
              --exclude='zh-CN.yml' \
              --exclude='zh-TW.yml' \
              || true
          )

          if (( ${#offenders[@]} > 0 )); then
            echo 'CJK text remains outside the intentional Chinese locale files:'
            printf '%s\n' "${offenders[@]}"
            exit 1
          fi

          echo 'English localization audit passed.'
