name: Verify FinalTECH Startup Fix

on:
  push:
    branches: [fix/finaltech-startup-compat]
    paths:
      - '.github/workflows/verify-startup-fix.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Verify repaired English YAML line
        shell: bash
        run: grep -F "item''s maximum stack size" src/main/resources/language/en-US.yml

      - name: Build shaded JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
