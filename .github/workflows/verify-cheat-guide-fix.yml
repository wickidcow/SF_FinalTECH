name: Verify FinalTECH Cheat Guide Fix

on:
  push:
    branches: [fix/cheat-guide-mode]
    paths:
      - 'src/main/java/io/taraxacum/finaltech/core/group/MainItemGroup.java'
      - 'src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java'
      - '.github/workflows/verify-cheat-guide-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6

      - name: Verify cheat semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'getSlimefunGuide(slimefunGuideMode)' src/main/java/io/taraxacum/finaltech/core/group/MainItemGroup.java
          grep -F 'boolean cheatMode = slimefunGuideMode == SlimefunGuideMode.CHEAT_MODE;' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'action.isShiftClicked() && LegacyGuideSettings.get().hasBookmarks()' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'action.isRightClicked()' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'LegacyGuideBookmarks.get().toggle' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'p.hasPermission("slimefun.cheat.items")' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'slimefunItem instanceof MultiBlockMachine' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          ! grep -F 'getSlimefunGuide(SlimefunGuideMode.SURVIVAL_MODE)' src/main/java/io/taraxacum/finaltech/core/group/MainItemGroup.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build FinalTECH
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
