name: Verify FinalTECH Cheat Guide Fix

on:
  push:
    branches: [fix/cheat-guide-mode]
    paths:
      - 'src/main/java/io/taraxacum/finaltech/core/group/MainItemGroup.java'
      - 'src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java'
      - 'scripts/apply_cheat_guide_fix.py'
      - '.github/workflows/verify-cheat-guide-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/cheat-guide-mode

      - name: Apply compile-compatible bookmark bridge
        run: python3 scripts/apply_cheat_guide_fix.py

      - name: Verify cheat semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'getSlimefunGuide(slimefunGuideMode)' src/main/java/io/taraxacum/finaltech/core/group/MainItemGroup.java
          grep -F 'boolean cheatMode = slimefunGuideMode == SlimefunGuideMode.CHEAT_MODE;' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'action.isShiftClicked() && hasLegacyBookmarks()' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'action.isRightClicked()' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'loadLegacyGuideClass' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'p.hasPermission("slimefun.cheat.items")' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          grep -F 'slimefunItem instanceof MultiBlockMachine' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          ! grep -F 'import io.github.thebusybiscuit.slimefun4.implementation.guide.enhanced.LegacyGuide' src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          ! grep -F 'getSlimefunGuide(SlimefunGuideMode.SURVIVAL_MODE)' src/main/java/io/taraxacum/finaltech/core/group/MainItemGroup.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build FinalTECH
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/taraxacum/finaltech/core/group/SubFlexItemGroup.java
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated source changes to commit.'
            exit 0
          fi
          git commit -m 'Bridge FinalTECH bookmarks to Slimefun Legacy'
          git push origin HEAD:fix/cheat-guide-mode
