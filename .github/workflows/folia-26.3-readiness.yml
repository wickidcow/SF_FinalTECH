name: Folia 26.3 Experimental Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/make_folia_probe_jar.py'
      - 'scripts/test_make_folia_probe_jar.py'
      - 'scripts/folia_26_3_runtime_smoke.sh'
      - '.github/workflows/folia-26.3-readiness.yml'
      - 'docs/folia-26.3-readiness.md'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finaltech-folia-26-3-${{ github.ref }}
  cancel-in-progress: true

env:
  SLIMEFUN_SOURCE: 6f5aa31302eb46d2afe8f77e27fa9e8ab90f7ee2
  SERVER_DOWNLOAD_USER_AGENT: SF-FinalTECH-Folia-26.3-Readiness/1.0

jobs:
  readiness:
    name: Test-only FinalTECH opt-in on Folia 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out FinalTECH
        uses: actions/checkout@v6

      - name: Check out exact validated Slimefun Legacy source
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: ${{ env.SLIMEFUN_SOURCE }}
          path: .deps/Slimefun-Legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify production descriptor remains unadmitted
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '^folia-supported[[:space:]]*:' src/main/resources/plugin.yml; then
            echo 'Production FinalTECH descriptor already opts into Folia; review this readiness workflow.' >&2
            exit 1
          fi

      - name: Verify probe copier
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_make_folia_probe_jar.py -v

      - name: Verify existing region-ownership contracts
        run: |
          python3 scripts/verify_part3_identity_safety.py
          python3 scripts/verify_part3_location_scheduler.py
          python3 scripts/verify_part3_matrix_reactor_scheduler.py
          python3 scripts/verify_part3_owned_tick_override.py
          python3 scripts/verify_part3_own_menu_ticks.py
          python3 scripts/verify_part3_single_location_ticker_data.py
          python3 scripts/verify_part3_cargo_region_ownership.py
          python3 scripts/verify_part3_line_cargo_region.py
          python3 scripts/verify_part3_mesh_cargo_region.py
          python3 scripts/verify_part3_particle_region_scheduler.py

      - name: Publish exact Slimefun API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          SOURCE_COMMIT="$SLIMEFUN_SOURCE" SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SLIMEFUN_SOURCE")" ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT -x test --no-daemon

      - name: Build normal FinalTECH release JAR
        run: >
          mvn -B --no-transfer-progress
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Build exact universal Slimefun runtime JAR
        working-directory: .deps/Slimefun-Legacy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          export SOURCE_COMMIT="$SLIMEFUN_SOURCE"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SLIMEFUN_SOURCE")"
          ./gradlew clean shadowJar --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -s "$JAR"
          mkdir -p ../finaltech-folia-input
          cp "$JAR" ../finaltech-folia-input/Slimefun-Legacy.jar

      - name: Create disposable FinalTECH Folia probe JAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          SOURCE="target/SF_FinalTECH${VERSION}.jar"
          test -s "$SOURCE"
          sha256sum "$SOURCE" | tee build-finaltech-release.sha256
          python3 scripts/make_folia_probe_jar.py "$SOURCE" build/FinalTECH-FoliaProbe.jar
          unzip -p build/FinalTECH-FoliaProbe.jar plugin.yml | grep -Eiq '^folia-supported:[[:space:]]*true[[:space:]]*$'
          ! unzip -p "$SOURCE" plugin.yml | grep -Eiq '^folia-supported[[:space:]]*:'
          unzip -tqq build/FinalTECH-FoliaProbe.jar

      - name: Boot Slimefun and FinalTECH twice on Folia 26.3
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/folia_26_3_runtime_smoke.sh
          bash scripts/folia_26_3_runtime_smoke.sh .deps/finaltech-folia-input/Slimefun-Legacy.jar build/FinalTECH-FoliaProbe.jar build/folia-26.3-runtime-smoke

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          echo '## FinalTECH Folia 26.3 experimental readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production descriptor opt-in: NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'Runtime uses a disposable descriptor-only probe copy.' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f build/folia-26.3-runtime-smoke/runtime-build.txt ]]; then
            cat build/folia-26.3-runtime-smoke/runtime-build.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/folia-26.3-runtime-smoke/smoke-result.txt ]]; then
            cat build/folia-26.3-runtime-smoke/smoke-result.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finaltech-folia-26.3-readiness
          path: |
            build-finaltech-release.sha256
            build/folia-26.3-runtime-smoke/*.console.log
            build/folia-26.3-runtime-smoke/runtime-build.txt
            build/folia-26.3-runtime-smoke/smoke-result.txt
          if-no-files-found: warn
