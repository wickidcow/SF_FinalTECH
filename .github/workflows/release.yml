name: Build and Publish FinalTECH JAR

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'pom.xml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FinalTECH
        uses: actions/checkout@v6

      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT -x test --no-daemon

      - name: Validate English YAML quoting
        run: python3 scripts/normalize_english_yaml.py --check

      - name: Parse English YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('src/main/resources/language/en-US.yml')
          with path.open(encoding='utf-8') as stream:
              yaml.safe_load(stream)
          print('English YAML parsed successfully.')
          PY

      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>3.0.2</version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<finalName>SF_FinalTECH${project.version}</finalName>' pom.xml
          grep -Fq 'api-version: 1.17' src/main/resources/plugin.yml

      - name: Verify Paper 1.21.11 baseline compilation
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Verify Paper 26.2 compatibility
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Verify Paper 26.3 alpha compatibility
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -Dpaper.version=26.3-rc-3.build.1-alpha
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Build universal release JAR from 1.21.11 baseline
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Resolve and verify release JAR
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          JAR="SF_FinalTECH${VERSION}.jar"
          TAG="v${VERSION}"
          test -s "target/${JAR}"
          unzip -t "target/${JAR}" >/dev/null
          unzip -p "target/${JAR}" plugin.yml | grep -Fq "version: ${VERSION}"
          python3 - <<PY
          import pathlib, struct, zipfile
          jar = pathlib.Path('target/${JAR}')
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = zf.read(name)[:8]
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  max_major = max(max_major, struct.unpack('>H', data[6:8])[0])
          print(f'{jar}: maximum class major version {max_major}')
          if max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY
          sha256sum "target/${JAR}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: target/${{ steps.version.outputs.jar }}
          archive: false
          if-no-files-found: error

      - name: Publish raw JAR release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          JAR="target/${{ steps.version.outputs.jar }}"
          NOTES="FinalTECH 3.0.2 adds Paper 26.3 alpha compatibility validation while preserving Paper 1.21.11 / Java 21 release compatibility and Paper 26.2 as the primary production target. The existing English YAML validation and recent FinalTECH compatibility fixes remain enforced."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_FinalTECH $TAG" --notes "$NOTES"
          fi
