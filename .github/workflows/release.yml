name: Build and Publish FinalTECH JAR

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'pom.xml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FinalTECH
        uses: actions/checkout@v6

      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT -x test --no-daemon

      - name: Validate English YAML quoting
        run: python3 scripts/normalize_english_yaml.py --check

      - name: Parse English YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('src/main/resources/language/en-US.yml')
          with path.open(encoding='utf-8') as stream:
              yaml.safe_load(stream)
          print('English YAML parsed successfully.')
          PY

      - name: Verify source hygiene
        run: python3 scripts/verify_source_hygiene.py

      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<finalName>SF_FinalTECH${project.version}</finalName>' pom.xml
          grep -Fq 'api-version: 1.17' src/main/resources/plugin.yml

      - name: Verify Part 2 storage boundaries
        run: |
          python3 scripts/verify_part2_storage_boundaries.py
          python3 scripts/test_storage_boundary_verifier.py

      - name: Verify Part 3 identity safety
        run: python3 scripts/verify_part3_identity_safety.py

      - name: Verify Part 3 location scheduler safety
        run: python3 scripts/verify_part3_location_scheduler.py

      - name: Verify Part 3 Matrix Reactor scheduler safety
        run: python3 scripts/verify_part3_matrix_reactor_scheduler.py

      - name: Verify Part 3 owned-tick override safety
        run: python3 scripts/verify_part3_owned_tick_override.py

      - name: Verify Part 3 own-menu tick safety
        run: python3 scripts/verify_part3_own_menu_ticks.py

      - name: Verify Part 3 single-location ticker-data safety
        run: python3 scripts/verify_part3_single_location_ticker_data.py

      - name: Verify Part 3 cargo region ownership safety
        run: python3 scripts/verify_part3_cargo_region_ownership.py

      - name: Verify Part 3 line cargo region safety
        run: python3 scripts/verify_part3_line_cargo_region.py

      - name: Verify Part 3 mesh cargo region safety
        run: python3 scripts/verify_part3_mesh_cargo_region.py

      - name: Verify Part 3 particle region scheduler safety
        run: python3 scripts/verify_part3_particle_region_scheduler.py

      - name: Verify unchecked generics boundary
        run: python3 scripts/verify_unchecked_generics_boundary.py

      - name: Verify ItemStack text compatibility
        run: python3 scripts/verify_itemstack_text_compat.py

      - name: Verify ItemStack type compatibility
        run: python3 scripts/verify_itemstack_type_compat.py

      - name: Verify legacy text compatibility
        run: python3 scripts/verify_legacy_text_compat.py

      - name: Verify modern entity APIs
        run: python3 scripts/verify_entity_api_compat.py

      - name: Verify non-network energy compatibility
        run: python3 scripts/verify_nonnetwork_energy_compat.py

      - name: Verify recipe API compatibility
        run: python3 scripts/verify_recipe_api_compat.py

      - name: Verify Paper 1.21.11 baseline compilation
        run: >-
          mvn -B --no-transfer-progress
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Verify Paper 26.2 compatibility
        run: >-
          mvn -B --no-transfer-progress
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Resolve Paper 26.3 primary API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          url = 'https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml'
          request = urllib.request.Request(url, headers={'User-Agent': 'FinalTECH-26.3-CI/1.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              root = ET.fromstring(response.read())

          versions = [
              node.text.strip()
              for node in root.findall('./versioning/versions/version')
              if node.text and node.text.strip().startswith('26.3')
          ]
          if not versions:
              raise SystemExit('No Paper 26.3 API version is currently published')

          version = versions[-1]
          print(f'Using Paper 26.3 API: {version}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'PAPER_26_3_VERSION={version}\n')
          PY

      - name: Verify Paper 26.3 primary compatibility
        run: >-
          mvn -B --no-transfer-progress
          -Dpaper.version=$PAPER_26_3_VERSION
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Build universal release JAR from 1.21.11 baseline
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
          clean package

      - name: Resolve and verify release JAR
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          JAR="SF_FinalTECH${VERSION}.jar"
          TAG="v${VERSION}"
          test -s "target/${JAR}"
          unzip -t "target/${JAR}" >/dev/null
          unzip -p "target/${JAR}" plugin.yml | grep -Fq "version: ${VERSION}"
          python3 - <<PY
          import pathlib, struct, zipfile
          jar = pathlib.Path('target/${JAR}')
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = zf.read(name)[:8]
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  max_major = max(max_major, struct.unpack('>H', data[6:8])[0])
          print(f'{jar}: maximum class major version {max_major}')
          if max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY
          sha256sum "target/${JAR}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: target/${{ steps.version.outputs.jar }}
          archive: false
          if-no-files-found: error

      - name: Publish raw JAR release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          JAR="target/${{ steps.version.outputs.jar }}"
          NOTES="Automated validated build of FinalTECH ${VERSION}. Compiled for Java 21 and verified against Paper 1.21.11, Paper 26.2, and the current Paper 26.3 API with the repository compatibility and localization guards enabled."

          # This repository intentionally keeps the current-version release asset
          # updated from validated main builds. Keep the tag/source commit aligned
          # with the JAR instead of leaving the release pointed at an older commit.
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "SF_FinalTECH $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_FinalTECH $TAG" --notes "$NOTES"
          fi
