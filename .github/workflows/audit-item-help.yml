name: Audit FinalTECH item help

on:
  push:
    branches: [guide/complete-item-help]
    paths:
      - 'src/main/resources/language/**'
      - 'src/main/java/io/taraxacum/finaltech/util/GuideItemLoreUtil.java'
      - 'src/main/java/io/taraxacum/finaltech/setup/FinalTechItemStacks.java'
      - '.github/workflows/audit-item-help.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compare active English and Chinese item help
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import re
          import yaml

          root = Path('src/main/resources/language')
          en = yaml.safe_load((root / 'en-US.yml').read_text(encoding='utf-8')) or {}
          zh = yaml.safe_load((root / 'zh-CN.yml').read_text(encoding='utf-8')) or {}
          en_items = en.get('items', {}) or {}
          zh_items = zh.get('items', {}) or {}

          item_stack_source = Path('src/main/java/io/taraxacum/finaltech/setup/FinalTechItemStacks.java').read_text(encoding='utf-8')
          active_ids = sorted(set(re.findall(r'"(_FINALTECH_[A-Z0-9_]+)"', item_stack_source)))
          if '"ManualCraftMachine"' in item_stack_source:
              active_ids.append('ManualCraftMachine')
              active_ids.sort()

          chinese = re.compile(r'[\u3400-\u9fff]')

          def useful_lines(value):
              if not isinstance(value, list):
                  return []
              return [str(v).strip() for v in value if v is not None and str(v).strip()]

          def info_sections(item):
              info = item.get('info', {}) if isinstance(item, dict) else {}
              if not isinstance(info, dict):
                  return {}
              result = {}
              for key, section in info.items():
                  if not isinstance(section, dict):
                      continue
                  lines = useful_lines(section.get('lore'))
                  if lines:
                      result[str(key)] = lines
              return result

          active_missing_english = []
          active_missing_info = []
          active_without_help = []
          active_chinese_left = []
          active_zh_flavor_without_en = []

          for item_id in active_ids:
              en_item = en_items.get(item_id)
              zh_item = zh_items.get(item_id)
              if not isinstance(en_item, dict):
                  active_missing_english.append(item_id)
                  continue

              einfo = info_sections(en_item)
              en_lore = useful_lines(en_item.get('lore'))
              en_guide = useful_lines(en_item.get('guide-lore'))
              if not einfo and not en_lore and not en_guide:
                  active_without_help.append(item_id)

              if isinstance(zh_item, dict):
                  zinfo = info_sections(zh_item)
                  for section in zinfo:
                      if section not in einfo:
                          active_missing_info.append(f'{item_id}.info.{section}')
                  zh_lore = useful_lines(zh_item.get('lore'))
                  if zh_lore and not en_lore:
                      active_zh_flavor_without_en.append(item_id)

              if chinese.search(yaml.safe_dump(en_item, allow_unicode=True)):
                  active_chinese_left.append(item_id)

          lines = [
              f'Active item IDs: {len(active_ids)}',
              f'English item entries total: {len(en_items)}',
              f'Chinese item entries total: {len(zh_items)}',
              f'Active items missing English entry: {len(active_missing_english)}',
              f'Active translated info sections missing: {len(active_missing_info)}',
              f'Active English items with no info/lore/guide-lore: {len(active_without_help)}',
              f'Active Chinese flavor-lore entries absent from English: {len(active_zh_flavor_without_en)}',
              f'Active English entries still containing Chinese text: {len(active_chinese_left)}',
          ]

          def section(title, values):
              if values:
                  lines.extend(['', title, *values])

          section('ACTIVE_MISSING_ENGLISH', active_missing_english)
          section('ACTIVE_MISSING_INFO', active_missing_info)
          section('ACTIVE_NO_ENGLISH_HELP', active_without_help)
          section('ACTIVE_ZH_FLAVOR_NOT_IN_EN', active_zh_flavor_without_en)
          section('ACTIVE_CHINESE_LEFT_IN_ENGLISH', active_chinese_left)

          report = '\n'.join(lines) + '\n'
          print(report, end='')
          Path('item-help-audit.txt').write_text(report, encoding='utf-8')

          gap_ids = set(active_missing_english) | set(active_without_help)
          for entry in active_missing_info:
              gap_ids.add(entry.split('.info.', 1)[0])

          source = {}
          for item_id in sorted(gap_ids):
              source[item_id] = {
                  'english': en_items.get(item_id),
                  'chinese': zh_items.get(item_id),
              }
          Path('item-help-source.yml').write_text(
              yaml.safe_dump(source, allow_unicode=True, sort_keys=False, width=120),
              encoding='utf-8'
          )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Maven build
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add item-help-audit.txt item-help-source.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update FinalTECH item help audit'
          git push
