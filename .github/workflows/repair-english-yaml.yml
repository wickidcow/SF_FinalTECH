name: Repair FinalTECH English YAML

on:
  push:
    branches: [fix/finaltech-startup-compat]
    paths:
      - 'scripts/repair_english_yaml.py'
      - '.github/workflows/repair-english-yaml.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/finaltech-startup-compat

      - name: Repair malformed English YAML
        run: python3 scripts/repair_english_yaml.py

      - name: Commit repaired locale
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/language/en-US.yml
          if git diff --cached --quiet; then
            echo 'No YAML repair needed.'
            exit 0
          fi
          git commit -m 'Fix English language YAML quoting'
          git push origin HEAD:fix/finaltech-startup-compat
